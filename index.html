<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Retiree Profiles</title>
<style>
:root{--bg:#f5f4f0;--card:#fff;--ink:#1d2433;--mut:#6b7280;--acc:#1f4e79;--ok:#2e7d32;--warn:#c62828;--line:#e2e0d9}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:78px}
header{background:var(--acc);color:#fff;padding:14px 16px;position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center}
header h1{margin:0;font-size:18px}
header small{font-weight:400;font-size:12px;opacity:.85;margin-left:8px}
.header-actions{display:flex;gap:8px;align-items:center}
.header-btn{background:rgba(255,255,255,0.2);color:#fff;border:none;padding:6px 10px;font-size:12px;border-radius:6px;cursor:pointer}
.header-btn:hover{background:rgba(255,255,255,0.3)}
.stats{display:flex;gap:8px;overflow-x:auto;padding:12px 12px 4px}
.stat{flex:0 0 auto;background:var(--card);border:2px solid transparent;border-radius:10px;padding:8px 12px;min-width:92px;text-align:center;cursor:pointer}
.stat.on{border-color:var(--acc)}
.stat b{display:block;font-size:22px}
.stat span{font-size:11px;color:var(--mut)}
.bar{margin:8px 12px;height:8px;background:#ddd;border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);width:0}
.tools{display:flex;gap:8px;padding:4px 12px}
input,textarea,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;font:inherit;background:#fff}
textarea{min-height:140px}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 3px}
.list{padding:8px 12px;display:grid;gap:8px}
.item{display:flex;gap:10px;background:var(--card);border-radius:10px;padding:10px;align-items:center;cursor:pointer;border:1px solid var(--line)}
.ph{width:56px;height:56px;border-radius:8px;background:#e8e6df;flex:0 0 56px;object-fit:cover;display:flex;align-items:center;justify-content:center;color:#aaa;font-size:11px}
.item .t{flex:1;min-width:0}
.item .n{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .s{font-size:12px;color:var(--mut)}
.tag{display:inline-block;font-size:11px;padding:2px 7px;border-radius:10px;margin:3px 3px 0 0}
.y{background:#e3f2e4;color:var(--ok)}.n0{background:#fde8e8;color:var(--warn)}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;gap:8px;padding:10px;z-index:6}
button{font:inherit;border:0;border-radius:8px;padding:12px;cursor:pointer;background:var(--acc);color:#fff;flex:1}
button:disabled{opacity:.5;cursor:default}
button.g{background:#e8e6df;color:var(--ink)}button.d{background:var(--warn)}
button.s{padding:6px 10px;font-size:12px;flex:0 0 auto;margin-left:6px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;z-index:10;overflow:auto}
.modal.show{display:block}
.sheet{background:#fff;max-width:560px;margin:0 auto;min-height:100%;padding:16px}
.row{display:flex;gap:8px}
.warn{background:#fff4e5;border:1px solid #f0b86e;border-radius:8px;padding:10px;margin:10px 12px;font-size:14px}
.sheet .warn{margin:10px 0}
.empty{text-align:center;color:var(--mut);padding:40px 16px}
.small{font-size:13px;color:var(--mut)}
.login{max-width:380px;margin:0 auto;padding:60px 20px}
.login h1{color:var(--acc);margin:0 0 4px}
.err{color:var(--warn);font-size:14px;min-height:20px;margin:8px 0}
.toast{position:fixed;left:12px;right:12px;bottom:90px;background:#1d2433;color:#fff;border-radius:10px;padding:12px 14px;z-index:20;display:none;font-size:14px;max-width:520px;margin:0 auto}
.toast.show{display:block}
#pz{border:2px dashed var(--line);border-radius:10px;padding:18px 14px;text-align:center;color:var(--mut);font-size:14px;margin-top:6px;min-height:92px;outline:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;cursor:pointer;transition:border-color .15s,background .15s}
#pz:focus,#pz.dragover{border-color:var(--acc);background:#eef5fb}
#pz .upload-icon{font-size:25px;line-height:1.2}
#pz .upload-hint{font-size:12px;color:var(--mut)}
#f_photo{display:none}
pre{background:#f1efe8;padding:10px;border-radius:8px;overflow:auto;font-size:12px;white-space:pre-wrap;word-break:break-all}
</style>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>
<body>

<div id="login" class="login" style="display:none">
  <h1>Admin Login</h1>
  <p class="small">Sign in to manage retiree profiles.</p>
  <form onsubmit="event.preventDefault();doLogin()">
    <label>Email</label><input id="lg_e" type="email" autocomplete="username" required>
    <label>Password</label><input id="lg_p" type="password" autocomplete="current-password" required>
    <div class="err" id="lg_err"></div>
    <button type="submit" style="width:100%">Sign in</button>
  </form>
  <p style="text-align:center"><a href="#" onclick="event.preventDefault();resetPw()" class="small">Forgot password?</a></p>
  <p style="text-align:center;margin-top:15px;"><a href="#" onclick="event.preventDefault();showPublicView()" class="small">&larr; Back to Public Directory</a></p>
</div>

<div id="app">
  <header>
    <h1>Retiree Profiles<small id="sync"></small></h1>
    <div class="header-actions">
      <button id="adminLoginBtn" class="header-btn" onclick="showLoginScreen()">Admin Login</button>
      <button id="adminLogoutBtn" class="header-btn" style="display:none" onclick="doLogout()">Logout</button>
    </div>
  </header>
  <div id="legacy"></div>
  <div class="stats" id="stats"></div>
  <div class="bar"><i id="prog"></i></div>
  <div class="tools"><input id="q" placeholder="Search name or number…" oninput="renderList()"></div>
  <div class="list" id="list"></div>
  <nav id="adminNav" style="display:none">
    <button onclick="openForm()">+ Add</button>
    <button class="g" onclick="$('quick').click()">Quick add photos</button>
    <button class="g" onclick="openMenu()">Export / Backup</button>
  </nav>
  <input type="file" id="quick" accept="image/*" multiple hidden onchange="handleQuickPhotos(this.files)">
  <input type="file" id="restore" accept=".json" hidden onchange="handleRestore(this.files[0])">
</div>

<div class="modal" id="m"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
// Replace this with your exact Firebase project credentials
const firebaseConfig = {
  apiKey: "YOUR_FIREBASE_API_KEY",
  authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
  projectId: "YOUR_PROJECT_ID",
  storageBucket: "YOUR_PROJECT_ID.appspot.com",
  messagingSenderId: "YOUR_SENDER_ID",
  appId: "YOUR_APP_ID"
};

if (!firebase.apps.length) {
  firebase.initializeApp(firebaseConfig);
}

const auth = firebase.auth();
const db = firebase.firestore();

let retirees = [];
let currentUser = null;
let currentFilter = 'all';

function $(id) { return document.getElementById(id); }

function toast(msg) {
  const t = $('toast');
  t.innerText = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

function showLoginScreen() {
  $('login').style.display = 'block';
  $('app').style.display = 'none';
}

function showPublicView() {
  $('login').style.display = 'none';
  $('app').style.display = 'block';
}

auth.onAuthStateChanged(user => {
  currentUser = user;
  if (user) {
    $('adminNav').style.display = 'flex';
    $('adminLoginBtn').style.display = 'none';
    $('adminLogoutBtn').style.display = 'inline-block';
  } else {
    $('adminNav').style.display = 'none';
    $('adminLoginBtn').style.display = 'inline-block';
    $('adminLogoutBtn').style.display = 'none';
  }
  showPublicView();
  fetchRetirees();
});

function doLogin() {
  const e = $('lg_e').value;
  const p = $('lg_p').value;
  $('lg_err').innerText = '';
  auth.signInWithEmailAndPassword(e, p).then(() => {
    showPublicView();
  }).catch(err => {
    $('lg_err').innerText = err.message;
  });
}

function doLogout() {
  auth.signOut().then(() => toast("Logged out safely."));
}

function resetPw() {
  const e = $('lg_e').value;
  if (!e) return alert("Please enter your email address first.");
  auth.sendPasswordResetEmail(e).then(() => alert("Password reset email sent.")).catch(err => alert(err.message));
}

function fetchRetirees() {
  db.collection('retirees').onSnapshot(snapshot => {
    retirees = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
    updateStats();
    renderList();
  }, err => {
    console.error("Firestore read error:", err);
  });
}

function updateStats() {
  const total = retirees.length;
  const withPhoto = retirees.filter(r => r.photoUrl).length;
  $('stats').innerHTML = `
    <div class="stat ${currentFilter==='all'?'on':''}" onclick="setFilter('all')"><b>${total}</b><span>Total</span></div>
    <div class="stat ${currentFilter==='photo'?'on':''}" onclick="setFilter('photo')"><b>${withPhoto}</b><span>Has Photo</span></div>
  `;
}

function setFilter(f) {
  currentFilter = f;
  updateStats();
  renderList();
}

function renderList() {
  const query = $('q').value.toLowerCase();
  const listEl = $('list');
  listEl.innerHTML = '';

  const filtered = retirees.filter(r => {
    const matchesQuery = (r.name && r.name.toLowerCase().includes(query)) || (r.number && r.number.toLowerCase().includes(query));
    const matchesFilter = currentFilter === 'photo' ? !!r.photoUrl : true;
    return matchesQuery && matchesFilter;
  });

  if (filtered.length === 0) {
    listEl.innerHTML = '<div class="empty">No retiree profiles found.</div>';
    return;
  }

  filtered.forEach(item => {
    const el = document.createElement('div');
    el.className = 'item';
    const imgHtml = item.photoUrl 
      ? `<img class="ph" src="${item.photoUrl}" alt="${item.name || ''}">` 
      : `<div class="ph">No Photo</div>`;
    
    el.innerHTML = `
      ${imgHtml}
      <div class="t">
        <div class="n">${item.name || 'Unnamed Profile'}</div>
        <div class="s">${item.number || 'No ID Number'}</div>
      </div>
    `;
    el.onclick = () => openView(item);
    listEl.appendChild(el);
  });
}

function compressImage(file, callback) {
  const reader = new FileReader();
  reader.onload = function(e) {
    const img = new Image();
    img.onload = function() {
      const canvas = document.createElement('canvas');
      const MAX_SIZE = 300;
      let w = img.width, h = img.height;
      if (w > h) {
        if (w > MAX_SIZE) { h *= MAX_SIZE / w; w = MAX_SIZE; }
      } else {
        if (h > MAX_SIZE) { w *= MAX_SIZE / h; h = MAX_SIZE; }
      }
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      callback(canvas.toDataURL('image/jpeg', 0.7));
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function openView(item) {
  const modal = $('m');
  const sheet = $('sheet');
  sheet.innerHTML = `
    <h2>${item.name || 'Unnamed'}</h2>
    <p><strong>ID Number:</strong> ${item.number || 'N/A'}</p>
    ${item.photoUrl ? `<img src="${item.photoUrl}" style="max-width:100%;border-radius:8px;margin-bottom:12px;">` : ''}
    <p><strong>Details:</strong> ${item.notes || 'No extra notes.'}</p>
    <div style="display:flex;gap:8px;margin-top:16px;">
      ${currentUser ? `<button onclick="openForm('${item.id}')">Edit</button><button class="d" onclick="deleteProfile('${item.id}')">Delete</button>` : ''}
      <button class="g" onclick="closeModal()">Close</button>
    </div>
  `;
  modal.classList.add('show');
}

function openForm(id = null) {
  const item = id ? retirees.find(r => r.id === id) : {};
  const modal = $('m');
  const sheet = $('sheet');
  sheet.innerHTML = `
    <h2>${id ? 'Edit' : 'Add'} Profile</h2>
    <form onsubmit="event.preventDefault();saveProfile('${id || ''}')">
      <label>Full Name</label>
      <input id="f_name" value="${item.name || ''}" required>
      <label>ID Number</label>
      <input id="f_num" value="${item.number || ''}">
      <label>Photo</label>
      <div id="pz" onclick="$('f_photo').click()">
        <span class="upload-icon">📷</span>
        <span>${item.photoUrl ? 'Click to replace photo' : 'Click to select photo'}</span>
      </div>
      <input type="file" id="f_photo" accept="image/*" onchange="previewPhoto(this)">
      <label>Notes</label>
      <textarea id="f_notes">${item.notes || ''}</textarea>
      <div style="display:flex;gap:8px;margin-top:16px;">
        <button type="submit">Save Profile</button>
        <button type="button" class="g" onclick="closeModal()">Cancel</button>
      </div>
    </form>
  `;
  modal.classList.add('show');
}

let tempPhotoUrl = null;
function previewPhoto(input) {
  if (input.files && input.files[0]) {
    compressImage(input.files[0], url => {
      tempPhotoUrl = url;
      $('pz').innerHTML = `<img src="${url}" style="height:60px;border-radius:6px;"><span>Photo ready</span>`;
    });
  }
}

function saveProfile(id) {
  if (!currentUser) return alert("Admin login required.");
  const payload = {
    name: $('f_name').value,
    number: $('f_num').value,
    notes: $('f_notes').value
  };
  if (tempPhotoUrl) payload.photoUrl = tempPhotoUrl;

  const promise = id 
    ? db.collection('retirees').doc(id).update(payload)
    : db.collection('retirees').add(payload);

  promise.then(() => {
    tempPhotoUrl = null;
    closeModal();
    toast("Profile saved!");
  }).catch(err => alert("Error: " + err.message));
}

function deleteProfile(id) {
  if (!currentUser) return alert("Admin login required.");
  if (confirm("Are you sure you want to delete this retiree profile?")) {
    db.collection('retirees').doc(id).delete().then(() => {
      closeModal();
      toast("Profile deleted.");
    });
  }
}

function closeModal() {
  $('m').classList.remove('show');
}

function openMenu() {
  const modal = $('m');
  const sheet = $('sheet');
  sheet.innerHTML = `
    <h2>Export & Backup Options</h2>
    <p class="small">Export profile directory data or restore from a JSON backup.</p>
    <div style="display:flex;flex-direction:column;gap:10px;margin-top:16px;">
      <button onclick="exportJSON()">Backup to JSON</button>
      <button class="g" onclick="$('restore').click()">Restore from JSON</button>
      <button class="g" onclick="closeModal()">Close</button>
    </div>
  `;
  modal.classList.add('show');
}

function exportJSON() {
  const data = JSON.stringify(retirees, null, 2);
  const blob = new Blob([data], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `retirees_backup_${new Date().toISOString().slice(0,10)}.json`;
  a.click();
}

function handleRestore(file) {
  if (!file || !currentUser) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const items = JSON.parse(e.target.result);
      if (Array.isArray(items)) {
        const batch = db.batch();
        items.forEach(item => {
          const ref = db.collection('retirees').doc();
          delete item.id;
          batch.set(ref, item);
        });
        batch.commit().then(() => {
          closeModal();
          toast("Backup restored successfully!");
        });
      }
    } catch(err) {
      alert("Invalid JSON backup file.");
    }
  };
  reader.readAsText(file);
}

function handleQuickPhotos(files) {
  if (!files.length || !currentUser) return;
  Array.from(files).forEach(file => {
    compressImage(file, url => {
      db.collection('retirees').add({
        name: file.name.replace(/\.[^/.]+$/, ""),
        photoUrl: url,
        number: ''
      });
    });
  });
  toast("Uploaded photo profiles.");
}
</script>
</body>
</html>
