<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Retiree Profiles</title>
<style>
:root{--bg:#f5f4f0;--card:#fff;--ink:#1d2433;--mut:#6b7280;--acc:#1f4e79;--ok:#2e7d32;--warn:#c62828;--line:#e2e0d9}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);padding-bottom:78px}
header{background:var(--acc);color:#fff;padding:14px 16px;position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center}
header h1{margin:0;font-size:18px}
header small{font-weight:400;font-size:12px;opacity:.85;margin-left:8px}
.header-actions{display:flex;gap:8px;align-items:center}
.header-btn{background:rgba(255,255,255,0.2);color:#fff;border:none;padding:6px 10px;font-size:12px;border-radius:6px;cursor:pointer;flex:none}
.header-btn:hover{background:rgba(255,255,255,0.3)}
.stats{display:flex;gap:8px;overflow-x:auto;padding:12px 12px 4px}
.stat{flex:0 0 auto;background:var(--card);border:2px solid transparent;border-radius:10px;padding:8px 12px;min-width:88px;text-align:center;cursor:pointer}
.stat.on{border-color:var(--acc)}
.stat b{display:block;font-size:20px}
.stat span{font-size:11px;color:var(--mut)}
.bar{margin:8px 12px;height:8px;background:#ddd;border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);width:0}
.tools{display:flex;gap:8px;padding:4px 12px}
.tools input{flex:1}
.tools select{width:auto;flex:none}
.tools button{flex:none;padding:10px 12px}
input,textarea,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;font:inherit;background:#fff}
textarea{min-height:140px}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 3px}
.list{padding:8px 12px;display:grid;gap:8px}
.list.grid{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
.item{display:flex;gap:12px;background:var(--card);border-radius:10px;padding:12px;align-items:center;cursor:pointer;border:1px solid var(--line)}
.list.grid .item{flex-direction:column;align-items:stretch;gap:8px}
.ph{width:52px;height:52px;border-radius:8px;background:#e8e6df;flex:0 0 52px;object-fit:cover;display:flex;align-items:center;justify-content:center;color:#aaa;font-size:10px}
.list.grid .ph{width:100%;height:180px;flex:none}
.item .t{flex:1;min-width:0}
.item .n{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-transform:uppercase}
.item .s{font-size:12px;color:var(--mut);margin-top:2px}
.tag{display:inline-block;font-size:10px;padding:2px 8px;border-radius:10px;margin-right:4px;font-weight:500}
.tag.y{background:#e3f2e4;color:var(--ok)}
.tag.n0{background:#fde8e8;color:var(--warn)}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;gap:8px;padding:10px;z-index:6}
button{font:inherit;border:0;border-radius:8px;padding:12px;cursor:pointer;background:var(--acc);color:#fff;flex:1}
button:disabled{opacity:.5;cursor:default}
button.g{background:#e8e6df;color:var(--ink)}button.d{background:var(--warn)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;z-index:10;overflow:auto}
.modal.show{display:block}
.sheet{background:#fff;max-width:620px;margin:20px auto;min-height:auto;padding:20px;border-radius:12px}
.empty{text-align:center;color:var(--mut);padding:40px 16px}
.small{font-size:13px;color:var(--mut)}
.login{max-width:380px;margin:60px auto;padding:20px}
.login h1{color:var(--acc);margin:0 0 4px}
.err{color:var(--warn);font-size:14px;min-height:20px;margin:8px 0}
.toast{position:fixed;left:12px;right:12px;bottom:90px;background:#1d2433;color:#fff;border-radius:10px;padding:12px 14px;z-index:20;display:none;font-size:14px;max-width:520px;margin:0 auto}
.toast.show{display:block}
#pz{border:2px dashed var(--line);border-radius:10px;padding:18px 14px;text-align:center;color:var(--mut);font-size:14px;margin-top:6px;min-height:92px;outline:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;cursor:pointer}
#f_photo{display:none}
.notice{margin:8px 12px;padding:10px 12px;border-radius:10px;background:#fff4d6;border:1px solid #f0d98a;font-size:13px;display:flex;gap:10px;align-items:center;justify-content:space-between}
.notice.bad{background:#fde8e8;border-color:#f3b4b4}
.notice button{flex:none;padding:6px 10px;font-size:12px}
.ret{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.08em;color:var(--mut)}
.bio p{margin:0 0 .8em}
.bio ul,.bio ol{margin:0 0 .8em;padding-left:1.4em}
.bio blockquote{margin:0 0 .8em;padding-left:10px;border-left:3px solid var(--line);color:#444}
.bio code{background:#f0eee8;padding:1px 4px;border-radius:4px}
.preview{border:1px solid var(--line);border-radius:8px;padding:10px;background:#fafaf7;max-height:220px;overflow:auto;font-size:14px}
.qrow{display:flex;gap:10px;align-items:flex-start;border-bottom:1px solid var(--line);padding:10px 0}
.qrow img{width:72px;height:72px;object-fit:cover;border-radius:8px;flex:none}
.qrow .f{flex:1;min-width:0}
.qrow textarea{min-height:70px}
.qrow button{flex:none;padding:6px 10px}
.row{display:flex;gap:8px;margin-top:16px}

<body>

<div id="login" class="login" style="display:none">
  <h1>Admin Login</h1>
  <p class="small">Sign in to manage retiree profiles.</p>
  <form onsubmit="event.preventDefault();doLogin()">
    <label>Email</label><input id="lg_e" type="email" autocomplete="username" required>
    <label>Password</label><input id="lg_p" type="password" autocomplete="current-password" required>
    <div class="err" id="lg_err"></div>
    <button type="submit" style="width:100%">Sign in</button>
  </form>
  <p style="text-align:center;margin-top:15px;"><a href="#" onclick="event.preventDefault();showPublicView()" class="small">&larr; Back to Public Directory</a></p>
</div>

<div id="app">
  <header>
    <h1>Retiree Profiles <small id="sync"></small></h1>
    <div class="header-actions">
      <button id="adminLoginBtn" class="header-btn" onclick="showLoginScreen()">Admin Login</button>
      <button id="adminLogoutBtn" class="header-btn" style="display:none" onclick="doLogout()">Logout</button>
    </div>
  </header>
  <div id="notices"></div>
  <div class="stats" id="stats"></div>
  <div class="bar"><i id="prog" style="width:0%"></i></div>
  <div class="tools">
    <input id="q" placeholder="Search name, RET number or bio…" oninput="renderList()">
    <select id="sortSel" onchange="renderList()">
      <option value="new">Newest first</option>
      <option value="old">Oldest first</option>
      <option value="az">A–Z</option>
    </select>
    <button class="g" id="viewBtn" onclick="toggleView()">Grid</button>
  </div>
  <div class="list" id="list"></div>

  <nav id="adminNav" style="display:none">
    <button onclick="openForm()">+ Add</button>
    <button class="g" onclick="$('quick').click()">Quick add photos</button>
    <button class="g" onclick="openMenu()">Menu</button>
  </nav>
  <input type="file" id="quick" accept="image/*" multiple hidden onchange="handleQuickPhotos(this.files)">
  <input type="file" id="restore" accept=".json" hidden onchange="handleRestore(this.files[0])">
</div>

<div class="modal" id="m"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
/* =====================  CONFIG  ===================== */
// Paste your Supabase details here (see SETUP-SUPABASE.md)
const SUPABASE_URL = 'https://bltrosbeyszluzozjfle.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_SbVkoFxBEL7l9ggdz2gvtA_DTdJMR35'; // publishable key (safe in a public page)
const SUPABASE_BUCKET = 'originals';

const firebaseConfig = {
  apiKey: "AIzaSyDIgOqBXt5P7OaPwbls2Zsf7NZ5Axv54lg",
  authDomain: "retirees-profile.firebaseapp.com",
  projectId: "retirees-profile",
  storageBucket: "retirees-profile.firebasestorage.app",
  messagingSenderId: "936958334006",
  appId: "1:936958334006:web:633015f01f39f458953497"
};

if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
const supa = (/^https?:\/\//.test(SUPABASE_URL) && SUPABASE_ANON_KEY.length > 30 && window.supabase)
  ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

let retirees = [];
let currentUser = null;
let currentFilter = 'all';
let viewMode = 'list';
try { viewMode = localStorage.getItem('rp_view') || 'list'; } catch (e) {}

function $(id) { return document.getElementById(id); }
function esc(s) {
  return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}
function fmtRet(n) { return 'RET-' + String(n).padStart(3, '0'); }
function stamp() { return new Date().toISOString().slice(0, 10); }

let toastTimer;
function toast(msg, sticky) {
  const t = $('toast');
  t.innerText = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  if (!sticky) toastTimer = setTimeout(() => t.classList.remove('show'), 3500);
}
function hideToast() { $('toast').classList.remove('show'); }

/* =====================  AUTH / VIEW  ===================== */
function showLoginScreen() { $('login').style.display = 'block'; $('app').style.display = 'none'; }
function showPublicView() { $('login').style.display = 'none'; $('app').style.display = 'block'; }

let unsub = null;
auth.onAuthStateChanged(user => {
  currentUser = user;
  $('adminNav').style.display = user ? 'flex' : 'none';
  $('adminLoginBtn').style.display = user ? 'none' : 'inline-block';
  $('adminLogoutBtn').style.display = user ? 'inline-block' : 'none';
  showPublicView();
  if (unsub) unsub();
  fetchRetirees();
});
function doLogin() {
  $('lg_err').innerText = '';
  auth.signInWithEmailAndPassword($('lg_e').value, $('lg_p').value)
    .then(showPublicView).catch(err => { $('lg_err').innerText = err.message; });
}
function doLogout() { auth.signOut().then(() => toast('Logged out safely.')); }

function fetchRetirees() {
  unsub = db.collection('profiles').onSnapshot(snapshot => {
    retirees = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
    updateStats();
    renderNotices();
    renderList();
  }, err => console.error('Firestore read error:', err));
}

function toggleView() {
  viewMode = viewMode === 'grid' ? 'list' : 'grid';
  try { localStorage.setItem('rp_view', viewMode); } catch (e) {}
  renderList();
}

/* =====================  STATS / NOTICES  ===================== */
function dupNames() {
  const c = {};
  retirees.forEach(r => { const k = (r.name || '').trim().toLowerCase(); if (k) c[k] = (c[k] || 0) + 1; });
  return new Set(Object.keys(c).filter(k => c[k] > 1));
}
const hasPhoto = r => !!r.thumb || (r.photoCount && r.photoCount > 0);
const hasBio = r => !!(r.bio || r.notes);

function updateStats() {
  const total = retirees.length;
  const complete = retirees.filter(r => r.name && hasPhoto(r) && hasBio(r)).length;
  const noPhoto = retirees.filter(r => !hasPhoto(r)).length;
  const noBio = retirees.filter(r => !hasBio(r)).length;
  const noName = retirees.filter(r => !r.name).length;
  const dn = dupNames();
  const dups = retirees.filter(r => dn.has((r.name || '').trim().toLowerCase())).length;
  $('prog').style.width = (total ? Math.round(complete / total * 100) : 0) + '%';
  const tile = (f, n, l) => `<div class="stat ${currentFilter === f ? 'on' : ''}" onclick="setFilter('${f}')"><b>${n}</b><span>${l}</span></div>`;
  $('stats').innerHTML = tile('all', total, 'Total') + tile('complete', complete, 'Complete') + tile('nophoto', noPhoto, 'No photo') +
    tile('nobio', noBio, 'No bio') + tile('noname', noName, 'No name') + tile('duplicates', dups, 'Duplicates?');
}
function setFilter(f) { currentFilter = f; updateStats(); renderList(); }

function renderNotices() {
  let h = '';
  if (currentUser) {
    const missing = retirees.filter(r => typeof r.retNo !== 'number').length;
    if (missing) h += `<div class="notice"><span><b>${missing}</b> profile(s) have no RET number yet.</span><button onclick="fillMissingRet()">Fill now</button></div>`;
    if (!supa) h += `<div class="notice bad"><span>Supabase is not configured, so original photos will <b>not</b> be saved. Fill in the two lines at the top of the script.</span></div>`;
  }
  $('notices').innerHTML = h;
}

/* =====================  LIST  ===================== */
function renderList() {
  const query = $('q').value.toLowerCase().trim();
  const sortBy = $('sortSel').value;
  const listEl = $('list');
  listEl.className = 'list' + (viewMode === 'grid' ? ' grid' : '');
  $('viewBtn').innerText = viewMode === 'grid' ? 'List' : 'Grid';
  const dn = dupNames();

  let filtered = retirees.filter(r => {
    const hay = ((r.name || '') + ' ' + (r.number || '') + ' ' + (r.bio || r.notes || '')).toLowerCase();
    if (query && !hay.includes(query)) return false;
    if (currentFilter === 'complete') return r.name && hasPhoto(r) && hasBio(r);
    if (currentFilter === 'nophoto') return !hasPhoto(r);
    if (currentFilter === 'nobio') return !hasBio(r);
    if (currentFilter === 'noname') return !r.name;
    if (currentFilter === 'duplicates') return dn.has((r.name || '').trim().toLowerCase());
    return true;
  });
  filtered = sortList(filtered, sortBy);

  if (!filtered.length) { listEl.innerHTML = '<div class="empty">No retiree profiles found.</div>'; return; }
  listEl.innerHTML = '';
  filtered.forEach(item => {
    const el = document.createElement('div');
    el.className = 'item';
    const img = item.thumb ? `<img class="ph" src="${esc(item.thumb)}" alt="Photo" loading="lazy">` : `<div class="ph">No Photo</div>`;
    const tg = (ok, l) => `<span class="tag ${ok ? 'y' : 'n0'}">${l}</span>`;
    el.innerHTML = `${img}<div class="t"><div class="n">${esc(item.name) || 'Unnamed Profile'}</div>
      <div class="s">${esc(item.number) || 'No RET number'}</div>
      <div style="margin-top:6px">${tg(item.name, 'name')} ${tg(hasBio(item), 'bio')} ${tg(item.thumb, 'photo')}</div></div>`;
    el.onclick = () => openView(item.id);
    listEl.appendChild(el);
  });
}
function sortList(arr, mode) {
  const a = arr.slice();
  const k = r => (typeof r.retNo === 'number' ? r.retNo : 0);
  if (mode === 'az') a.sort((x, y) => (x.name || '\uffff').localeCompare(y.name || '\uffff'));
  else if (mode === 'old') a.sort((x, y) => k(x) - k(y) || (x.createdAt || 0) - (y.createdAt || 0));
  else a.sort((x, y) => k(y) - k(x) || (y.createdAt || 0) - (x.createdAt || 0));
  return a;
}

/* =====================  BIO FORMATTING (WhatsApp markup)  ===================== */
const INL = /(^|[\s(\[{"'\u201c\u2018])(```|\*|_|~)(?=\S)([\s\S]*?\S)\2(?=$|[\s.,;:!?)\]}"'\u201d\u2019])/;
function parseInline(s, st) {
  st = st || {};
  const out = [];
  let rest = String(s);
  while (rest) {
    const m = INL.exec(rest);
    if (!m) { out.push(Object.assign({ t: rest }, st)); break; }
    const pre = rest.slice(0, m.index + m[1].length);
    if (pre) out.push(Object.assign({ t: pre }, st));
    const flag = { '*': 'b', '_': 'i', '~': 's', '```': 'm' }[m[2]];
    if (flag === 'm') out.push(Object.assign({ t: m[3] }, st, { m: true }));
    else out.push(...parseInline(m[3], Object.assign({}, st, { [flag]: true })));
    rest = rest.slice(m.index + m[0].length);
  }
  return out;
}
function parseBlocks(text) {
  const lines = String(text || '').replace(/\r/g, '').split('\n');
  const blocks = []; let cur = null;
  const push = () => { if (cur) { blocks.push(cur); cur = null; } };
  for (const raw of lines) {
    const line = raw.replace(/\s+$/, '');
    if (!line.trim()) { push(); continue; }
    let m;
    if ((m = /^\s*[-*\u2022\u2013]\s+(.*)$/.exec(line))) { if (!cur || cur.type !== 'ul') { push(); cur = { type: 'ul', items: [] }; } cur.items.push(m[1]); }
    else if ((m = /^\s*(\d+)[.)]\s+(.*)$/.exec(line))) { if (!cur || cur.type !== 'ol') { push(); cur = { type: 'ol', items: [] }; } cur.items.push(m[2]); }
    else if ((m = /^\s*>\s?(.*)$/.exec(line))) { if (!cur || cur.type !== 'q') { push(); cur = { type: 'q', lines: [] }; } cur.lines.push(m[1]); }
    else { if (!cur || cur.type !== 'p') { push(); cur = { type: 'p', lines: [] }; } cur.lines.push(line.trim()); }
  }
  push();
  return blocks;
}
function inlineHtml(line) {
  return parseInline(line).map(s => {
    let h = esc(s.t);
    if (s.m) h = `<code>${h}</code>`;
    if (s.s) h = `<s>${h}</s>`;
    if (s.i) h = `<i>${h}</i>`;
    if (s.b) h = `<b>${h}</b>`;
    return h;
  }).join('');
}
function bioHtml(text) {
  return parseBlocks(text).map(b => {
    if (b.type === 'ul') return '<ul>' + b.items.map(i => `<li>${inlineHtml(i)}</li>`).join('') + '</ul>';
    if (b.type === 'ol') return '<ol>' + b.items.map(i => `<li>${inlineHtml(i)}</li>`).join('') + '</ol>';
    if (b.type === 'q') return '<blockquote>' + b.lines.map(inlineHtml).join('<br>') + '</blockquote>';
    return '<p>' + b.lines.map(inlineHtml).join('<br>') + '</p>';
  }).join('');
}

/* =====================  IMAGES  ===================== */
function processImageFile(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('Could not read ' + file.name));
    reader.onload = e => {
      const img = new Image();
      img.onerror = () => reject(new Error('Could not open ' + file.name + ' (unsupported image type?)'));
      img.onload = () => {
        const pw = img.width, ph = img.height;
        const scaled = max => {
          const c = document.createElement('canvas');
          let w = pw, h = ph;
          if (w > h) { if (w > max) { h *= max / w; w = max; } } else { if (h > max) { w *= max / h; h = max; } }
          c.width = Math.round(w); c.height = Math.round(h);
          c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
          return c.toDataURL('image/jpeg', 0.7);
        };
        resolve({ data: scaled(1000), thumb: scaled(300), pw, ph });
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

async function uploadOriginal(profileId, file) {
  if (!supa) return null;
  const safe = file.name.replace(/[^a-zA-Z0-9._-]/g, '_').slice(-60);
  const path = `${profileId}/${Date.now()}-${safe}`;
  const { error } = await supa.storage.from(SUPABASE_BUCKET).upload(path, file, { contentType: file.type || 'application/octet-stream', upsert: false });
  if (error) throw new Error(error.message || 'Supabase upload failed');
  const { data } = supa.storage.from(SUPABASE_BUCKET).getPublicUrl(path);
  return { originalUrl: data.publicUrl, originalPath: path, originalType: file.type || '', originalSize: file.size, originalName: file.name };
}

async function addPhotoDoc(profileRef, file, res) {
  let up = null, upErr = null;
  try { up = await uploadOriginal(profileRef.id, file); } catch (e) { upErr = e; }
  await profileRef.collection('photos').doc().set(Object.assign({
    data: res.data, thumb: res.thumb, pw: res.pw, ph: res.ph, order: 0, created: Date.now()
  }, up || {}));
  await profileRef.set({ thumb: res.thumb, photoCount: 1 }, { merge: true });
  return upErr;
}
async function deletePhotoDocs(profileRef) {
  const snap = await profileRef.collection('photos').get();
  for (let i = 0; i < snap.docs.length; i += 400) {
    const b = db.batch();
    snap.docs.slice(i, i + 400).forEach(d => b.delete(d.ref));
    await b.commit();
  }
}
const photoSrc = p => p.originalUrl || p.data || p.thumb || '';

/* =====================  RET NUMBERS  ===================== */
async function allocRet(n) {
  const ref = db.collection('meta').doc('counter');
  const localMax = Math.max(0, ...retirees.map(r => (typeof r.retNo === 'number' ? r.retNo : 0)));
  return db.runTransaction(async tx => {
    const s = await tx.get(ref);
    const next = Math.max((s.exists && s.data().next) || 1, localMax + 1);
    tx.set(ref, { next: next + n });
    return next;
  });
}

async function fillMissingRet() {
  if (!currentUser) return;
  const todo = retirees.filter(r => typeof r.retNo !== 'number');
  if (!todo.length) { toast('Every profile already has a RET number.'); return; }
  if (!confirm(`Give RET numbers to ${todo.length} profile(s)? Existing numbers are kept. Profiles are numbered alphabetically by name, and nothing is deleted.`)) return;
  toast('Numbering profiles…', true);
  const used = new Set();
  retirees.forEach(r => { if (typeof r.retNo === 'number') used.add(r.retNo); });
  const need = [];
  todo.forEach(r => {
    const m = /^\s*RET[-\s]?(\d+)\s*$/i.exec(r.number || '');
    const v = m ? parseInt(m[1], 10) : NaN;
    if (v > 0 && !used.has(v)) { used.add(v); r._assign = v; } else need.push(r);
  });
  let max = Math.max(0, ...used);
  need.sort((a, b) => (a.name || '\uffff').localeCompare(b.name || '\uffff'));
  need.forEach(r => { r._assign = ++max; });
  const all = todo.slice();
  for (let i = 0; i < all.length; i += 400) {
    const b = db.batch();
    all.slice(i, i + 400).forEach(r => {
      const upd = { retNo: r._assign, number: fmtRet(r._assign) };
      if (!r.createdAt) upd.createdAt = 1700000000000 + r._assign * 1000;
      if (r.number && !/^\s*RET[-\s]?\d+\s*$/i.test(r.number)) upd.oldNumber = r.number;
      b.set(db.collection('profiles').doc(r.id), upd, { merge: true });
    });
    await b.commit();
  }
  const cref = db.collection('meta').doc('counter');
  await db.runTransaction(async tx => {
    const s = await tx.get(cref);
    tx.set(cref, { next: Math.max((s.exists && s.data().next) || 1, max + 1) });
  });
  all.forEach(r => delete r._assign);
  closeModal();
  toast('RET numbers filled in.');
}

    let html = '';

          : `<div class="small" style="margin-bottom:8px">Compressed copy only (no original stored)</div>`);

}

let tempPhoto = null;
function openForm(id) {
  if (!currentUser) return;
  tempPhoto = null;
  const item = id ? (retirees.find(r => r.id === id) || {}) : {};
  const bio = item.bio || item.notes || '';
  $('sheet').innerHTML = `
    <h2>${id ? 'Edit' : 'Add'} Profile</h2>
    <form onsubmit="event.preventDefault();saveProfile('${id || ''}')">
      <label>Full Name</label>
      <input id="f_name" value="${esc(item.name || '')}" required>
      <label>RET number (automatic, reference only)</label>
      <input value="${esc(item.number || 'Assigned when you save')}" disabled>
      <label>Photo ${item.thumb ? '(choosing a new photo replaces the current one)' : ''}</label>
      <div id="pz" onclick="$('f_photo').click()">
        ${item.thumb ? `<img src="${esc(item.thumb)}" style="height:60px;border-radius:6px;">` : '<span>📷</span>'}
        <span>${item.thumb ? 'Tap to replace photo' : 'Tap to select photo'}</span>
      </div>
      <input type="file" id="f_photo" accept="image/*" onchange="previewPhoto(this)">
      <label>Bio (paste from WhatsApp as it is)</label>
      <textarea id="f_notes" oninput="$('f_prev').innerHTML=bioHtml(this.value)">${esc(bio)}</textarea>
      <label>Preview (how it will look and export)</label>
      <div class="preview bio" id="f_prev">${bioHtml(bio)}</div>
      <div class="row">
        <button type="submit" id="saveBtn">Save Profile</button>
        <button type="button" class="g" onclick="closeModal()">Cancel</button>
      </div>

}
async function previewPhoto(input) {
  const f = input.files && input.files[0];
  if (!f) return;
  try {
    const res = await processImageFile(f);
    tempPhoto = { file: f, res };
    $('pz').innerHTML = `<img src="${res.thumb}" style="height:60px;border-radius:6px;"><span>Photo ready (${(f.size / 1048576).toFixed(2)} MB original)</span>`;
  } catch (e) { alert(e.message); }
}

async function saveProfile(id) {
  if (!currentUser) return alert('Admin login required.');
  const btn = $('saveBtn'); btn.disabled = true; btn.innerText = 'Saving…';
  try {
    const existing = id ? retirees.find(r => r.id === id) : null;
    const ref = id ? db.collection('profiles').doc(id) : db.collection('profiles').doc();
    const payload = { name: $('f_name').value.trim(), bio: $('f_notes').value };
    if (!id || !existing || typeof existing.retNo !== 'number') {
      const n = await allocRet(1);
      payload.retNo = n; payload.number = fmtRet(n);
      if (!existing || !existing.createdAt) payload.createdAt = id ? 1700000000000 + n * 1000 : Date.now();
    }
    await ref.set(payload, { merge: true });
    let warn = '';
    if (tempPhoto) {
      if (id) await deletePhotoDocs(ref);
      const err = await addPhotoDoc(ref, tempPhoto.file, tempPhoto.res);
      if (err) warn = ' But the original could not be uploaded to Supabase (' + err.message + '). A compressed copy was saved.';
    }
    tempPhoto = null;
    closeModal();
    toast('Profile saved.' + warn, !!warn);
  } catch (err) { alert('Error: ' + err.message); btn.disabled = false; btn.innerText = 'Save Profile'; }
}

async function deleteProfile(id) {
  if (!currentUser) return alert('Admin login required.');
  const r = retirees.find(x => x.id === id) || {};
  if (!confirm(`Delete ${r.name || 'this profile'} (${r.number || 'no number'})? This cannot be undone. Take a backup first if unsure.`)) return;
  try {
    const ref = db.collection('profiles').doc(id);
    await deletePhotoDocs(ref);
    await ref.delete();
    closeModal();
    toast('Profile deleted.');
  } catch (e) { alert('Error: ' + e.message); }
}
function closeModal() { $('m').classList.remove('show'); }

/* =====================  QUICK ADD  ===================== */
let quickItems = [];
async function handleQuickPhotos(files) {
  if (!currentUser || !files.length) return;
  const list = Array.from(files);
  quickItems = [];
  for (let i = 0; i < list.length; i++) {
    toast(`Preparing photo ${i + 1} of ${list.length}…`, true);
    try { quickItems.push({ file: list[i], res: await processImageFile(list[i]), name: '', bio: '' }); }
    catch (e) { alert(e.message); }
  }
  $('quick').value = '';
  hideToast();
  if (quickItems.length) renderQuick();
}
function renderQuick() {
  $('sheet').innerHTML = `
    <h2>Quick add (${quickItems.length})</h2>
    <p class="small">Type the name and paste the bio for each photo. RET numbers are given automatically in this order.</p>
    ${quickItems.map((q, i) => `
      <div class="qrow"><img src="${q.res.thumb}">
        <div class="f"><input placeholder="Full name" value="${esc(q.name)}" oninput="quickItems[${i}].name=this.value">
        <textarea placeholder="Bio (optional, paste from WhatsApp)" oninput="quickItems[${i}].bio=this.value" style="margin-top:6px">${esc(q.bio)}</textarea></div>
        <button class="g" onclick="quickItems.splice(${i},1);renderQuick()">✕</button></div>`).join('')}
    <div class="row"><button id="qsave" onclick="saveQuick()">Save all</button><button class="g" onclick="closeModal()">Cancel</button></div>`;
  $('m').classList.add('show');
}
async function saveQuick() {
  if (!currentUser || !quickItems.length) return;
  $('qsave').disabled = true;
  const n = quickItems.length;
  let failed = 0;
  try {
    const start = await allocRet(n);
    for (let i = 0; i < n; i++) {
      toast(`Saving ${i + 1} of ${n}…`, true);
      const q = quickItems[i];
      const ref = db.collection('profiles').doc();
      await ref.set({ name: q.name.trim(), bio: q.bio, retNo: start + i, number: fmtRet(start + i), createdAt: Date.now() + i, thumb: q.res.thumb, photoCount: 0 });
      const err = await addPhotoDoc(ref, q.file, q.res);
      if (err) failed++;
    }
    quickItems = [];
    closeModal();
    toast(failed ? `Saved ${n}. ${failed} original(s) could not be uploaded to Supabase; compressed copies were kept.` : `Saved ${n} profile(s) with originals.`, !!failed);
  } catch (e) { alert('Error: ' + e.message); $('qsave').disabled = false; }
}

/* =====================  MENU / BACKUP / RESTORE  ===================== */
function openMenu() {
  $('sheet').innerHTML = `
    <h2>Menu</h2>
    <div style="display:flex;flex-direction:column;gap:10px;margin-top:12px;">
      <button onclick="openExport()">Export for printing (PDF / Word)</button>
      <button onclick="backupFull()">Full backup to JSON (with photos)</button>
      <button class="g" onclick="$('restore').click()">Restore from JSON backup</button>
      <button class="g" onclick="fillMissingRet()">Fill missing RET numbers</button>
      <button class="g" onclick="closeModal()">Close</button>
    </div>
    <p class="small" style="margin-top:14px">Original photos: ${supa ? 'Supabase connected' : '<b style="color:var(--warn)">Supabase not configured</b>'}</p>`;
  $('m').classList.add('show');
}
function ser(v) {
  if (v && typeof v.toMillis === 'function') return v.toMillis();
  return v;
}
function serObj(o) { const r = {}; Object.keys(o).forEach(k => { r[k] = ser(o[k]); }); return r; }
function downloadBlob(blob, name) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 10000);
}
async function loadPhotos(id) {
  const snap = await db.collection('profiles').doc(id).collection('photos').orderBy('order').get();
  return snap.docs.map(d => ({ id: d.id, ...d.data() }));
}
async function backupFull() {
  if (!currentUser) return;
  try {
    const out = [];
    const list = sortList(retirees, 'old');
    for (let i = 0; i < list.length; i++) {
      toast(`Backing up ${i + 1} of ${list.length}…`, true);
      const photos = (await loadPhotos(list[i].id)).map(serObj);
      out.push(Object.assign(serObj(list[i]), { photos }));
    }
    downloadBlob(new Blob([JSON.stringify({ version: 2, exported: new Date().toISOString(), profiles: out })], { type: 'application/json' }), `profiles_full_backup_${stamp()}.json`);
    toast('Backup downloaded. Original photos remain in Supabase; the backup holds their links.');
  } catch (e) { alert('Backup failed: ' + e.message); }
}
function handleRestore(file) {
  if (!file || !currentUser) return;
  const reader = new FileReader();
  reader.onload = async e => {
    try {
      const parsed = JSON.parse(e.target.result);
      const items = Array.isArray(parsed) ? parsed : parsed.profiles;
      if (!Array.isArray(items)) throw new Error('Not a profiles backup');
      if (!confirm(`Restore ${items.length} profile(s)? Matching profiles are updated, none are duplicated, nothing is deleted.`)) return;
      let maxRet = 0;
      for (let i = 0; i < items.length; i++) {
        toast(`Restoring ${i + 1} of ${items.length}…`, true);
        const { id, photos, ...rest } = items[i];
        const ref = id ? db.collection('profiles').doc(id) : db.collection('profiles').doc();
        await ref.set(rest, { merge: true });
        if (typeof rest.retNo === 'number') maxRet = Math.max(maxRet, rest.retNo);
        for (const p of (photos || [])) {
          const { id: pid, ...pr } = p;
          await ref.collection('photos').doc(pid || undefined).set(pr, { merge: true });
        }
      }
      if (maxRet) {
        const cref = db.collection('meta').doc('counter');
        await db.runTransaction(async tx => {
          const s = await tx.get(cref);
          tx.set(cref, { next: Math.max((s.exists && s.data().next) || 1, maxRet + 1) });
        });
      }
      closeModal();
      toast('Backup restored.');
    } catch (err) { alert('Restore failed: ' + err.message); }
    $('restore').value = '';
  };
  reader.readAsText(file);
}

/* =====================  EXPORT (PDF / WORD)  ===================== */
function openExport() {
  $('sheet').innerHTML = `
    <h2>Export for printing</h2>
    <p class="small">One profile per page: name, RET number (small label), full-size photo and the formatted bio. Photos use the stored original where one exists.</p>
    <label>Title (cover page)</label><input id="x_title" value="Retiree Profiles">
    <label>Which profiles</label>
    <select id="x_scope"><option value="all">All profiles</option><option value="shown">Only what is currently shown in the list (filter and search)</option></select>
    <label>Order</label>
    <select id="x_order"><option value="current">Same as the list (${$('sortSel').selectedOptions[0].text})</option><option value="asc">RET number, lowest first</option></select>
    <label style="display:flex;gap:8px;align-items:center;color:var(--ink)"><input type="checkbox" id="x_cover" checked style="width:auto"> Include a cover page</label>
    <div class="row"><button onclick="doExport('pdf')">PDF (print)</button><button onclick="doExport('docx')">Word (.docx)</button></div>
    <div class="row" style="margin-top:8px"><button class="g" onclick="closeModal()">Cancel</button></div>
    <p class="small" style="margin-top:12px">PDF opens a print page. Choose "Save as PDF" as the printer. In the print dialog, switch off "Headers and footers" for a clean result.</p>`;
  $('m').classList.add('show');
}
function currentShownList() {
  const query = $('q').value.toLowerCase().trim();
  const dn = dupNames();
  const f = retirees.filter(r => {
    const hay = ((r.name || '') + ' ' + (r.number || '') + ' ' + (r.bio || r.notes || '')).toLowerCase();
    if (query && !hay.includes(query)) return false;
    if (currentFilter === 'complete') return r.name && hasPhoto(r) && hasBio(r);
    if (currentFilter === 'nophoto') return !hasPhoto(r);
    if (currentFilter === 'nobio') return !hasBio(r);
    if (currentFilter === 'noname') return !r.name;
    if (currentFilter === 'duplicates') return dn.has((r.name || '').trim().toLowerCase());
    return true;
  });
  return f;
}
async function gatherExport() {
  const scope = $('x_scope').value, order = $('x_order').value;
  let list = scope === 'shown' ? currentShownList() : retirees.slice();
  list = sortList(list, order === 'asc' ? 'old' : $('sortSel').value);
  const data = [];
  for (let i = 0; i < list.length; i++) {
    toast(`Collecting ${i + 1} of ${list.length}…`, true);
    data.push(Object.assign({}, list[i], { photos: await loadPhotos(list[i].id) }));
  }
  return { data, title: $('x_title').value || 'Retiree Profiles', cover: $('x_cover').checked };
}

async function doExport(kind) {
  if (!currentUser) return;
  let win = null;
  if (kind === 'pdf') {
    win = window.open('', '_blank');
    if (!win) { alert('Please allow pop-ups for this page, then try again.'); return; }
    win.document.write('<p style="font:16px sans-serif;padding:20px">Preparing your document…</p>');
  }
  try {
    const { data, title, cover } = await gatherExport();
    if (!data.length) { toast('Nothing to export.'); if (win) win.close(); return; }
    if (kind === 'pdf') await exportPdf(win, data, title, cover);
    else await exportDocx(data, title, cover);
    toast(kind === 'pdf' ? 'Print page ready.' : 'Word file downloaded.');
  } catch (e) { if (win) win.close(); alert('Export failed: ' + e.message); }
}

async function exportPdf(win, data, title, cover) {
  const dateStr = new Date().toLocaleDateString(undefined, { year: 'numeric', month: 'long', day: 'numeric' });
  const css = `@page{size:A4;margin:16mm 14mm 18mm;@bottom-center{content:counter(page);font:10px sans-serif;color:#888}}
  *{box-sizing:border-box}body{font-family:Georgia,'Times New Roman',serif;color:#111;font-size:13pt;line-height:1.45;margin:0}
  .cover{page-break-after:always;break-after:page;text-align:center;padding-top:80mm}
  .cover h1{font-size:34pt;margin:0 0 10px}.cover p{font:13pt sans-serif;color:#555;margin:4px 0}
  .prof{page-break-after:always;break-after:page}.prof:last-child{page-break-after:auto;break-after:auto}
  .ret{font:600 9pt sans-serif;letter-spacing:.14em;color:#777;text-transform:uppercase}
  h2{font-size:24pt;margin:2px 0 12px;line-height:1.15}
  .photo{margin:0 0 14px}.photo img{display:block;margin:0 auto 8px;max-width:100%;max-height:115mm;object-fit:contain}
  .bio p{margin:0 0 .7em}.bio ul,.bio ol{margin:0 0 .7em;padding-left:1.4em}.bio blockquote{margin:0 0 .7em;padding-left:10px;border-left:3px solid #ccc;color:#444}
  .bio code{font-family:Consolas,monospace;background:#f1f1f1;padding:0 3px}
  .none{color:#999;font:italic 11pt sans-serif}`;
  let body = '';
  if (cover) body += `<section class="cover"><h1>${esc(title)}</h1><p>${data.length} profile(s)</p><p>${esc(dateStr)}</p></section>`;
  data.forEach(r => {
    const imgs = (r.photos.length ? r.photos.map(photoSrc) : (r.thumb ? [r.thumb] : [])).filter(Boolean)
      .map(s => `<img src="${esc(s)}" alt="">`).join('');
    body += `<section class="prof"><div class="ret">${esc(r.number || '')}</div><h2>${esc(r.name) || 'Unnamed'}</h2>
      ${imgs ? `<div class="photo">${imgs}</div>` : ''}<div class="bio">${bioHtml(r.bio || r.notes) || '<p class="none">No bio.</p>'}</div></section>`;
  });
  win.document.open();
  win.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>${esc(title)}</title><style>${css}</style></head><body>${body}</body></html>`);
  win.document.close();
  const imgs = Array.from(win.document.images);
  await Promise.all(imgs.map(i => i.complete ? 0 : new Promise(res => { i.onload = i.onerror = res; })));
  win.focus();
  win.print();
}

async function exportDocx(data, title, cover) {
  if (!window.docx) throw new Error('The Word library did not load. Check your internet connection and reload.');
  const { Document, Packer, Paragraph, TextRun, ImageRun, AlignmentType } = window.docx;
  const FONT = 'Georgia';
  const runsFor = (segs, size) => segs.map(s => new TextRun({ text: s.t, bold: !!s.b, italics: !!s.i, strike: !!s.s, font: s.m ? 'Consolas' : FONT, size: size || 24 }));
  const lineRuns = lines => {
    const out = [];
    lines.forEach((l, i) => { if (i) out.push(new TextRun({ break: 1 })); out.push(...runsFor(parseInline(l))); });
    return out;
  };
  const kids = [];
  if (cover) {
    kids.push(new Paragraph({ alignment: AlignmentType.CENTER, spacing: { before: 4000, after: 200 }, children: [new TextRun({ text: title, bold: true, size: 72, font: FONT })] }));
    kids.push(new Paragraph({ alignment: AlignmentType.CENTER, children: [new TextRun({ text: `${data.length} profile(s)`, size: 26, color: '555555', font: FONT })] }));
    kids.push(new Paragraph({ alignment: AlignmentType.CENTER, children: [new TextRun({ text: new Date().toLocaleDateString(undefined, { year: 'numeric', month: 'long', day: 'numeric' }), size: 26, color: '555555', font: FONT })] }));
  }
  for (let i = 0; i < data.length; i++) {
    toast(`Building Word file ${i + 1} of ${data.length}…`, true);
    const r = data[i];
    const brk = cover || i > 0;
    kids.push(new Paragraph({ pageBreakBefore: brk, spacing: { after: 40 }, children: [new TextRun({ text: r.number || '', bold: true, size: 18, color: '777777', font: 'Arial' })] }));
    kids.push(new Paragraph({ spacing: { after: 200 }, children: [new TextRun({ text: r.name || 'Unnamed', bold: true, size: 44, font: FONT })] }));
    for (const p of r.photos) {
      try {
        const im = await docxImage(p);
        if (im) kids.push(new Paragraph({ alignment: AlignmentType.CENTER, spacing: { after: 160 }, children: [new ImageRun({ data: im.buf, type: im.type, transformation: { width: im.w, height: im.h } })] }));
      } catch (e) { console.warn('Image skipped', e); }
    }
    const blocks = parseBlocks(r.bio || r.notes);
    if (!blocks.length) kids.push(new Paragraph({ children: [new TextRun({ text: 'No bio.', italics: true, color: '999999', font: FONT })] }));
    blocks.forEach(b => {
      if (b.type === 'ul') b.items.forEach(it => kids.push(new Paragraph({ bullet: { level: 0 }, spacing: { after: 60 }, children: runsFor(parseInline(it)) })));
      else if (b.type === 'ol') b.items.forEach((it, n) => kids.push(new Paragraph({ indent: { left: 540, hanging: 300 }, spacing: { after: 60 }, children: [new TextRun({ text: (n + 1) + '.  ', size: 24, font: FONT }), ...runsFor(parseInline(it))] })));
      else if (b.type === 'q') kids.push(new Paragraph({ indent: { left: 400 }, spacing: { after: 140 }, children: lineRuns(b.lines).map(x => x) }));
      else kids.push(new Paragraph({ spacing: { after: 140 }, children: lineRuns(b.lines) }));
    });
  }
  const doc = new Document({ creator: 'Retiree Profiles', title, sections: [{ properties: { page: { margin: { top: 1000, bottom: 1000, left: 1100, right: 1100 } } }, children: kids }] });
  downloadBlob(await Packer.toBlob(doc), `${title.replace(/[^\w-]+/g, '_')}_${stamp()}.docx`);
}
async function docxImage(p) {
  const MAXW = 480, MAXH = 470;
  let buf = null, type = 'jpg';
  if (p.originalUrl) {
    try {
      const resp = await fetch(p.originalUrl);
      if (resp.ok) {
        const blob = await resp.blob();
        if (/jpe?g/i.test(blob.type)) { buf = await blob.arrayBuffer(); type = 'jpg'; }
        else if (/png/i.test(blob.type)) { buf = await blob.arrayBuffer(); type = 'png'; }
      }
    } catch (e) { /* fall back below */ }
  }
  if (!buf && p.data) { buf = await (await fetch(p.data)).arrayBuffer(); type = 'jpg'; }
  if (!buf) return null;
  let w = p.pw || 4, h = p.ph || 3;
  const s = Math.min(MAXW / w, MAXH / h, 1e9);
  return { buf, type, w: Math.round(w * s), h: Math.round(h * s) };
}
